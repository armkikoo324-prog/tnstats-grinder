name: TNStats Auto Grinder Cloud Runner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-grinder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Execute Puppeteer script
        env:
          CHANNEL_NAME: ${{ secrets.CHANNEL_NAME }}
          CHANNEL_PASSWORD: ${{ secrets.CHANNEL_PASSWORD }}
        run: node grind.js
